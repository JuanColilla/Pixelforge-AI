[project]
name = "pixelorama-mcp"
version = "0.1.0"
description = "MCP server that lets Claude draw pixel art in Pixelorama through the AI Studio bridge"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mcp>=2.3,<3"]

[project.scripts]
pixelorama-mcp = "pixelorama_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixelorama_mcp"]
